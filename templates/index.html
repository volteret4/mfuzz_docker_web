                updateDownloadStatus(downloadId, status) {
                    const statusElement = document.getElementById(
                        `download-status-${downloadId}`,
                    );
                    const progressBarElement = document.getElementById(
                        `progress-bar-${downloadId}`,
                    );

                    if (!statusElement) return;

                    if (
                        status.download_mode === "ssh" ||
                        status.ssh_transfer_complete ||
                        [
                            "ssh_preparing",
                            "ssh_transferring",
                            "ssh_compressing",
                            "ssh_cleaning",
                            "ssh_ready_download",
                        ].includes(status.status)
                    ) {
                        this.updateSSHDownloadStatus(downloadId, status);
                        return;
                    }

                    // Actualizar barra de progreso si existe
                    if (progressBarElement && status.progress !== undefined) {
                        const progressPercent = Math.round(
                            status.progress || 0,
                        );
                        progressBarElement.style.width = `${progressPercent}%`;
                        progressBarElement.textContent = `${progressPercent}%`;
                    }

                    if (status.status === "completed") {
                        // Quitar la animación de la barra cuando se complete
                        if (progressBarElement) {
                            progressBarElement.classList.remove(
                                "progress-bar-animated",
                                "progress-bar-striped",
                            );
                            progressBarElement.style.width = "100%";
                            progressBarElement.textContent = "100%";
                        }

                        const autoDeleteInfo = status.auto_delete_scheduled
                            ? `<small class="text-warning">⏰ Borrado automático en ${Math.max(0, Math.round((status.auto_delete_at * 1000 - Date.now()) / 1000))}s</small>`
                            : "";

                        statusElement.innerHTML = `
                        <div class="alert alert-success">
                            <h6><i class="fas fa-check-circle"></i> Descarga completada</h6>
                            <p><strong>${status.album_name || "Álbum"}</strong> - ${status.artist_name || "Artista"}</p>
                            <p>Archivos: ${status.successful_files || 0} | Tamaño: ${window.formatBytes(status.file_size || 0)}</p>
                            ${autoDeleteInfo}

                            <div class="mt-3 d-flex gap-2 flex-wrap">
                                <button class="btn" onclick="app.downloadFile('${downloadId}')">
                                    <i class="fas fa-download"></i> Descargar ZIP
                                </button>
                                <button class="btn btn-success" onclick="app.extractAlbum('${downloadId}')">
                                    <i class="fas fa-folder-open"></i> Extraer Álbum
                                </button>
                                ${
                                    status.auto_delete_scheduled
                                        ? `<button class="btn btn-outline-warning btn-sm" onclick="app.cancelAutoDelete('${downloadId}')">

                                    </button>`
                                        : ""
                                }
                            </div>

                            ${
                                status.failed_files && status.failed_files > 0
                                    ? `<div class="mt-2">
                                    <small class="text-warning">⚠️ ${status.failed_files} archivos fallaron</small>
                                </div>`
                                    : ""
                            }
                        </div>
                    `;
                    } else if (status.status === "error") {
                        statusElement.innerHTML = `
                        <div class="alert alert-danger">
                            <h6><i class="fas fa-exclamation-triangle"></i> Error en descarga</h6>
                            <p>${status.error || "Error desconocido"}</p>

                        const progressPercent = Math.round(
                            status.progress || 0,
                        );
                        const currentTrack =
                            status.current_track || "Procesando...";
                        const statusText = window.getStatusText(status.status);

                        // Actualizar solo el contenido del estado si existe el contenedor
                        const statusContentElement = document.getElementById(
                            `downloadStatus-${downloadId}`,
                        );
                        if (statusContentElement) {
                            statusContentElement.innerHTML = `
                            <div class="progress-status">
                                <div class="current-track">${currentTrack}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span>${status.processed_tracks || 0}/${status.total_tracks || "?"} archivos</span>

                                </div>
                            </div>

                    }

                switchTab(tabName) {
                    document
                        .querySelectorAll(".tab")
                        .forEach((tab) => tab.classList.remove("active"));
                    event.target.classList.add("active");

                    this.currentTab = tabName;
                    this.showContent(tabName);

                async showContent(tabName, customContent = null) {
                    if (customContent) {
                        document.getElementById("content").innerHTML =
                            customContent;
                        return;
                    }

                    switch (tabName) {
                        case "search":
                            this.showSearchContent();
                            break;
                        case "recent":
                            await this.showRecentSearches();
                            break;
                        case "popular":
                            await this.showPopularArtists();
                            break;
                        case "concerts":
                            this.showConcerts();
                            break;
                        case "new":
                            this.showNewReleases();
                            break;
                        case "config":
                            await this.showConfig();
                            break;
                        case "statistics":
                            await this.showStatistics(); // MODIFICADO: ahora cargar en la misma página
                            break;
                    }
                }

                            container.innerHTML = `<div class="error-message">${data.error}</div>`;

                        }

                            for (const [tableName, tableInfo] of Object.entries(

                                tablesHtml += `
                                <tr>
                                    <td>${tableName}</td>

                                            <tr>
                                                <th>Tabla</th>

                        console.error(

                        container.innerHTML = `<div class="error-message">Error cargando estadísticas de base de datos</div>`;

                async loadMissingDataStats(container) {
                    try {
                        const response = await fetch("/api/stats/missing-data");
                        const data = await response.json();

                        if (data.error) {
                            container.innerHTML = `<div class="error-message">${data.error}</div>`;
                            return;
                        }

                        let tablesHtml = "";
                        for (const [tableName, tableStats] of Object.entries(
                            data,
                        )) {
                            if (tableStats.fields) {
                                for (const [
                                    fieldName,
                                    fieldStats,
                                ] of Object.entries(tableStats.fields)) {
                                    const completenessClass =
                                        window.getCompletenessClass
                                            ? window.getCompletenessClass(
                                                  fieldStats.completeness,
                                              )
                                            : fieldStats.completeness >= 80
                                              ? "completeness-excellent"
                                              : fieldStats.completeness >= 60
                                                ? "completeness-good"
                                                : "completeness-poor";

                                    tablesHtml += `
                                    <tr>
                                        <td>${tableName}</td>
                                        <td>${fieldName}</td>
                                        <td>${fieldStats.filled ? fieldStats.filled.toLocaleString() : 0}</td>
                                        <td>${fieldStats.missing ? fieldStats.missing.toLocaleString() : 0}</td>
                                        <td>
                                            <div class="completeness-bar">
                                                <div class="completeness-fill ${completenessClass}"
                                                    style="width: ${fieldStats.completeness || 0}%">
                                                    ${fieldStats.completeness || 0}%
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                `;
                                }
                            }
                        }

                        container.innerHTML = `
                        <div class="stats-section">
                            <h2>Análisis de Datos Faltantes</h2>

                            ${
                                tablesHtml
                                    ? `
                                <div class="data-table">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Tabla</th>
                                                <th>Campo</th>
                                                <th>Completos</th>
                                                <th>Faltantes</th>
                                                <th>Completitud</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${tablesHtml}
                                        </tbody>
                                    </table>
                                </div>
                            `
                                    : "<p>No se encontraron datos de completitud</p>"
                            }
                        </div>
                    `;
                    } catch (error) {
                        console.error(
                            "Error cargando análisis de datos faltantes:",
                            error,
                        );
                        container.innerHTML = `<div class="error-message">Error cargando análisis de datos faltantes</div>`;
                    }
                }

                async loadStatsCategory(category, clickEvent = null) {
                    // REEMPLAZAR el método loadStatsCategory completo con:

                    if (clickEvent) {
                        document
                            .querySelectorAll(".tab")
                            .forEach((tab) => tab.classList.remove("active"));
                        clickEvent.target.classList.add("active");
                    }

                    const statsContent =
                        document.getElementById("stats-content");
                    if (!statsContent) return;

                    statsContent.innerHTML =
                        '<div class="loading"><i class="fas fa-spinner"></i><p>Cargando estadísticas...</p></div>';

                    try {
                        if (category === "detailed-analysis") {
                            statsContent.innerHTML = `
                            <div class="stats-section">
                                <h2>Análisis Detallado</h2>
                                <p style="margin-bottom: 30px; color: #ccc;">Funcionalidad de análisis detallado próximamente disponible</p>
                            </div>
                        `;
                            return;
                        }

                        if (category === "database") {
                            await this.loadDatabaseStats(statsContent);
                            return;
                        }

                        if (category === "missing") {
                            await this.loadMissingDataStats(statsContent);
                            return;
                        }

                        const response = await fetch(`/api/stats/${category}`);
                        const data = await response.json();

                        if (data.error) {
                            statsContent.innerHTML = `<div class="error-message">${data.error}</div>`;
                            return;
                        }

                        // Renderizar según la categoría
                        if (category === "artists") {
                            statsContent.innerHTML =
                                this.buildArtistsStats(data);
                        } else if (category === "albums") {
                            statsContent.innerHTML =
                                this.buildAlbumsStats(data);
                        } else if (category === "songs") {
                            statsContent.innerHTML = this.buildSongsStats(data);
                        }
                    } catch (error) {
                        console.error(
                            `Error cargando estadísticas de ${category}:`,
                            error,
                        );
                        statsContent.innerHTML = `<div class="error-message">Error cargando estadísticas de ${category}</div>`;
                    }
                }

                async showRecentSearches() {
                    this.showLoading("Cargando búsquedas recientes...");

                    try {
                        const response = await fetch("/api/recent/searches");
                        const data = await response.json();

                        if (data.error) {
                            window.showError(data.error);
                            return;
                        }

                        if (!data.searches.length) {
                            this.showContent(
                                "recent",
                                `
                            <div class="no-results">
                                <i class="fas fa-history" style="font-size: 3rem; margin-bottom: 20px; display: block;"></i>
                                <p>No hay búsquedas recientes</p>
                            </div>
                        `,
                            );
                            return;
                        }

                        const content = `
                        <h2>Búsquedas Recientes</h2>
                        <div class="track-list">
                            ${data.searches
                                .map(
                                    (search) => `
                                <div class="track-item" onclick="app.searchFromHistory('${search.search_term}')">
                                    <div class="track-number">
                                        <i class="fas fa-search"></i>
                                    </div>
                                    <div class="track-info">
                                        <div class="track-title">${search.search_term}</div>

                                </div>
                            `,
                                )
                                .join("")}
                        </div>
                    `;

                        this.showContent("recent", content);
                    } catch (error) {
                        console.error(
                            "Error cargando búsquedas recientes:",
                            error,
                        );
                        window.showError("Error cargando búsquedas recientes");
                    }
                }

                async showPopularArtists() {
                    this.showLoading("Cargando artistas populares...");

                    try {
                        const response = await fetch("/api/artists/popular");
                        const data = await response.json();

                        if (data.error) {
                            window.showError(data.error);
                            return;
                        }

                        const content = `
                        <h2>Artistas Más Populares</h2>
                        ${this.renderArtistsGrid(data.artists)}
                    `;

                        this.showContent("popular", content);
                    } catch (error) {
                        console.error(
                            "Error cargando artistas populares:",
                            error,
                        );
                        window.showError("Error cargando artistas populares");
                    }
                }

                showConcerts() {
                    const content = `
                    <div class="no-results">
                        <i class="fas fa-calendar" style="font-size: 3rem; margin-bottom: 20px; display: block;"></i>
                        <p>Función de conciertos próximamente disponible</p>
                    </div>
                `;
                    this.showContent("concerts", content);
                }

                showNewReleases() {
                    const content = `
                    <div class="no-results">
                        <i class="fas fa-plus" style="font-size: 3rem; margin-bottom: 20px; display: block;"></i>
                        <p>Función de nuevos lanzamientos próximamente disponible</p>
                    </div>
                `;
                    this.showContent("new", content);
                }

                async showConfig() {
                    this.showLoading("Cargando configuración...");

                    try {
                        const response = await fetch("/api/system/info");
                        const data = await response.json();

                        if (data.error) {
                            window.showError(data.error);
                            return;
                        }

                        const dbInfo = data.database;
                        const tables = Object.keys(dbInfo.tables || {});

                        const content = `
                        <h2>Configuración del Sistema</h2>
                        <div class="results-grid">
                            <div class="card">
                                <div class="card-image">
                                    <i class="fas fa-database" style="font-size: 4rem; color: #a8e6cf;"></i>
                                </div>
                                <div class="card-title">Base de Datos</div>
                                <div class="card-info">
                                    ${tables.length} tablas<br>
                                    ${dbInfo.tables?.songs?.count || 0} canciones<br>
                                    ${dbInfo.tables?.artists?.count || 0} artistas<br>
                                    ${dbInfo.tables?.albums?.count || 0} álbumes
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-image">
                                    <i class="fas fa-cog" style="font-size: 4rem; color: #a8e6cf;"></i>
                                </div>
                                <div class="card-title">Configuración</div>
                                <div class="card-info">
                                    Telegram: ${data.config.telegram_enabled ? "Habilitado" : "Deshabilitado"}<br>
                                    Música: ${data.config.music_root}<br>
                                    Descargas: ${data.config.downloads}
                                </div>
                            </div>
                        </div>
                    `;

                        this.showContent("config", content);
                    } catch (error) {
                        console.error("Error cargando configuración:", error);
                        window.showError("Error cargando configuración");
                    }
                }

                searchFromHistory(term) {
                    document.getElementById("searchBox").value = term;
                    this.performSearch();
                    this.switchTab("search");
                    document
                        .querySelector('[data-tab="search"]')
                        .classList.add("active");
                }

                showLoading(message = "Cargando...", containerId = "content") {
                    const container = document.getElementById(containerId);
                    if (container) {
                        container.innerHTML = `
                        <div class="loading">
                            <i class="fas fa-spinner"></i>
                            <p>${message}</p>
                        </div>
                    `;
                    } else {
                        // Fallback a función global si existe
                        if (typeof window.showLoading === "function") {
                            window.showLoading(message);
                        }
                    }
                }

                async showArtistDetailed(artistId) {
                    window.pushHistory({ type: "artist", id: artistId });
                    this.showLoading("Cargando información del artista...");

                    try {
                        const [artistResponse, albumsResponse] =
                            await Promise.all([
                                fetch(`/api/artists/${artistId}`),
                                fetch(`/api/artists/${artistId}/albums`),
                            ]);

                        const artistData = await artistResponse.json();
                        const albumsData = await albumsResponse.json();

                        if (artistData.error || albumsData.error) {
                            window.showError(
                                "Error cargando información del artista",
                            );
                            return;
                        }

                        this.renderArtistDetailedPage(
                            artistData.artist,
                            albumsData.albums,
                        );
                    } catch (error) {
                        console.error("Error cargando artista:", error);
                        window.showError(
                            "Error cargando información del artista",
                        );
                    }
                }
            }

            // Inicializar la aplicación
            const app = new MusicWebExplorer();
        </script>
    </body>
</html>
