<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Web Explorer</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            rel="stylesheet"
        />
        <script src="/static/js/global-functions.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #1e3c72, #2a5298);
                color: #fff;
                min-height: 100vh;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            .header h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
                background: linear-gradient(45deg, #fff, #a8e6cf);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .search-container {
                margin-bottom: 30px;
                position: relative;
            }

            .search-icon {
                position: absolute;
                left: 20px;
                color: #666;
                font-size: 1.2rem;
                z-index: 10;
            }

            .search-box {
                width: 100%;
                padding: 15px 20px 15px 55px; /* Espacio para el icono */
                font-size: 1.2rem;
                border: none;
                border-radius: 15px;
                background: rgba(255, 255, 255, 0.9);
                color: #333;
                outline: none;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }

            .search-box-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }

            .search-box::placeholder {
                color: #666;
            }

            .search-btn:hover {
                background: #1e3c72;
                transform: translateY(-50%) scale(1.05);
            }

            .tabs-container {
                display: flex;
                justify-content: center;
                gap: 15px;
                margin-bottom: 30px;
                flex-wrap: wrap;
            }

            .tab {
                background: rgba(255, 255, 255, 0.1);
                border: none;
                padding: 12px 20px;
                border-radius: 25px;
                color: white;
                cursor: pointer;
                font-size: 1rem;
                transition: all 0.3s ease;
                backdrop-filter: blur(5px);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .tab:hover,
            .tab.active {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            }

            .content-area {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 20px;
                padding: 30px;
                backdrop-filter: blur(10px);
                min-height: 400px;
            }

            .loading {
                text-align: center;
                padding: 40px;
                font-size: 1.2rem;
                color: #a8e6cf;
            }

            .loading i {
                font-size: 2rem;
                animation: spin 1s linear infinite;
                margin-bottom: 10px;
                display: block;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .results-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
                margin-top: 20px;
            }

            .card {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 15px;
                padding: 20px;
                backdrop-filter: blur(5px);
                transition: all 0.3s ease;
                cursor: pointer;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                background: rgba(255, 255, 255, 0.15);
            }

            .card-image {
                width: 100%;
                height: 200px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .card-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 10px;
            }

            .card-title {
                font-size: 1.3rem;
                font-weight: bold;
                margin-bottom: 8px;
                color: #fff;
            }

            .card-subtitle {
                font-size: 1rem;
                color: #a8e6cf;
                margin-bottom: 10px;
            }

            .card-info {
                font-size: 0.9rem;
                color: #ccc;
                line-height: 1.4;
            }

            .breadcrumb {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 20px;
                font-size: 1rem;
            }

            .breadcrumb-item {
                cursor: pointer;
                padding: 8px 15px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                transition: all 0.3s ease;
            }

            .breadcrumb-item:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .breadcrumb-separator {
                color: #a8e6cf;
            }

            .track-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .track-item {
                background: rgba(255, 255, 255, 0.05);
                padding: 15px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .track-item:hover {
                background: rgba(255, 255, 255, 0.1);
                transform: translateX(5px);
            }

            .track-number {
                background: #2a5298;
                color: white;
                padding: 8px 12px;
                border-radius: 50%;
                font-weight: bold;
                min-width: 40px;
                text-align: center;
            }

            .track-info {
                flex: 1;
            }

            .track-title {
                font-size: 1.1rem;
                font-weight: bold;
                margin-bottom: 5px;
            }

            .track-duration {
                color: #a8e6cf;
                font-size: 0.9rem;
            }

            .track-actions {
                display: flex;
                gap: 10px;
            }

            .btn {
                background: #2a5298;
                color: white;
                border: none;
                padding: 8px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 0.9rem;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .btn:hover {
                background: #1e3c72;
                transform: translateY(-2px);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                color: white;
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .lyrics-container {
                background: rgba(255, 255, 255, 0.05);
                padding: 20px;
                border-radius: 15px;
                margin-top: 20px;
                max-height: 400px;
                overflow-y: auto;
            }

            .lyrics-text {
                line-height: 1.6;
                white-space: pre-line;
                font-family: "Georgia", serif;
                font-size: 1.1rem;
            }

            .error-message {
                background: rgba(220, 53, 69, 0.2);
                color: #ff6b6b;
                padding: 15px;
                border-radius: 10px;
                margin: 20px 0;
                text-align: center;
            }

            .no-results {
                text-align: center;
                padding: 40px;
                color: #a8e6cf;
                font-size: 1.2rem;
            }

            .download-progress {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                padding: 20px;
                margin: 20px 0;
                position: relative;
            }

            .progress-bar {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 10px;
                height: 25px;
                overflow: hidden;
                margin: 15px 0;
                position: relative;
            }

            .progress-fill {
                background: linear-gradient(90deg, #a8e6cf, #2a5298);
                height: 100%;
                transition: width 0.3s ease;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 0.9rem;
                position: relative;
                z-index: 2;
            }

            .progress-status {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 8px;
                padding: 10px;
                margin-top: 10px;
                font-size: 0.9rem;
                color: #a8e6cf;
            }

            .current-track {
                font-weight: bold;
                color: white;
                margin-bottom: 5px;
            }

            .search-results-tabs {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            .search-tab {
                background: rgba(255, 255, 255, 0.1);
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                color: white;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .search-tab.active {
                background: #2a5298;
            }

            .back-btn {
                background: rgba(255, 255, 255, 0.1);
                border: none;
                color: white;
                padding: 10px 15px;
                border-radius: 10px;
                cursor: pointer;
                margin-bottom: 20px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: all 0.3s ease;
            }

            .back-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateX(-3px);
            }

            .artist-info {
                display: grid;
                grid-template-columns: 200px 1fr;
                gap: 30px;
                margin-bottom: 30px;
            }

            .artist-image {
                width: 200px;
                height: 200px;
                border-radius: 15px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.1);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .artist-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .artist-details h2 {
                font-size: 2rem;
                margin-bottom: 15px;
                color: #a8e6cf;
            }

            .artist-bio {
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .artist-links {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .link-btn {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                text-decoration: none;
                padding: 8px 15px;
                border-radius: 20px;
                font-size: 0.9rem;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .link-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
            }

            /* Estilos para alertas y toasts */
            .alert {
                padding: 15px;
                border-radius: 10px;
                margin: 10px 0;
                border: 1px solid transparent;
            }

            .alert-success {
                background: rgba(40, 167, 69, 0.2);
                border-color: rgba(40, 167, 69, 0.3);
                color: #a8e6cf;
            }

            .alert-info {
                background: rgba(23, 162, 184, 0.2);
                border-color: rgba(23, 162, 184, 0.3);
                color: #87ceeb;
            }

            .alert-warning {
                background: rgba(255, 193, 7, 0.2);
                border-color: rgba(255, 193, 7, 0.3);
                color: #ffd700;
            }

            .alert-danger {
                background: rgba(220, 53, 69, 0.2);
                border-color: rgba(220, 53, 69, 0.3);
                color: #ff6b6b;
            }

            .progress {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 5px;
                height: 20px;
                overflow: hidden;
                margin: 10px 0;
            }

            .progress-bar {
                background: linear-gradient(90deg, #a8e6cf, #2a5298);
                height: 100%;
                border-radius: 5px;
                transition: width 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 0.8rem;
            }

            .progress-bar-striped {
                background-image: linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.15) 25%,
                    transparent 25%,
                    transparent 50%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0.15) 75%,
                    transparent 75%,
                    transparent
                );
                background-size: 1rem 1rem;
            }

            .progress-bar-animated {
                animation: progress-bar-stripes 1s linear infinite;
            }

            @keyframes progress-bar-stripes {
                0% {
                    background-position: 1rem 0;
                }
                100% {
                    background-position: 0 0;
                }
            }

            .d-flex {
                display: flex;
            }

            .gap-2 {
                gap: 10px;
            }

            .flex-wrap {
                flex-wrap: wrap;
            }

            .mt-2 {
                margin-top: 10px;
            }

            .mt-3 {
                margin-top: 15px;
            }

            .mb-0 {
                margin-bottom: 0;
            }

            .mb-2 {
                margin-bottom: 10px;
            }

            .btn-sm {
                padding: 5px 10px;
                font-size: 0.8rem;
            }

            .btn-outline-warning {
                background: transparent;
                border: 1px solid #ffd700;
                color: #ffd700;
            }

            .btn-outline-warning:hover {
                background: rgba(255, 215, 0, 0.1);
            }

            .btn-outline-secondary {
                background: transparent;
                border: 1px solid #6c757d;
                color: #6c757d;
            }

            .btn-outline-secondary:hover {
                background: rgba(108, 117, 125, 0.1);
            }

            .text-warning {
                color: #ffd700;
            }

            .text-muted {
                color: #ccc;
            }

            @media (max-width: 768px) {
                .container {
                    padding: 10px;
                }

                .header h1 {
                    font-size: 2rem;
                }

                .tabs-container {
                    gap: 8px;
                }

                .tab {
                    padding: 8px 12px;
                    font-size: 0.9rem;
                }

                .results-grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(250px, 1fr)
                    );
                    gap: 15px;
                }

                .artist-info {
                    grid-template-columns: 1fr;
                    text-align: center;
                }

                .artist-image {
                    margin: 0 auto;
                }
                /* AGREGAR al final de los estilos en index.html: */

                .system-overview {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 20px;
                    margin-bottom: 30px;
                }

                .system-card {
                    background: rgba(255, 255, 255, 0.1);
                    border-radius: 15px;
                    padding: 20px;
                    backdrop-filter: blur(5px);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    text-align: center;
                    transition: all 0.3s ease;
                }

                .system-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                }

                .system-card h3 {
                    color: #a8e6cf;
                    margin-bottom: 10px;
                    font-size: 1.2rem;
                }

                .system-card .value {
                    font-size: 2rem;
                    font-weight: bold;
                    color: #fff;
                    margin: 10px 0;
                }

                .system-card .label {
                    color: #ccc;
                    font-size: 0.9rem;
                }

                .stats-section {
                    margin-bottom: 40px;
                }

                .stats-section h2 {
                    color: #a8e6cf;
                    margin-bottom: 20px;
                    font-size: 1.5rem;
                    border-bottom: 2px solid rgba(168, 230, 207, 0.3);
                    padding-bottom: 10px;
                }

                .data-table {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 10px;
                    overflow: hidden;
                    margin: 20px 0;
                }

                .data-table h3 {
                    background: rgba(255, 255, 255, 0.1);
                    color: #a8e6cf;
                    padding: 15px;
                    margin: 0;
                    font-size: 1.1rem;
                }

                .data-table table {
                    width: 100%;
                    border-collapse: collapse;
                }

                .data-table th,
                .data-table td {
                    padding: 12px;
                    text-align: left;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                }

                .data-table th {
                    background: rgba(255, 255, 255, 0.1);
                    color: #a8e6cf;
                    font-weight: bold;
                }

                .data-table tr:hover {
                    background: rgba(255, 255, 255, 0.05);
                }

                .completeness-bar {
                    background: rgba(255, 255, 255, 0.2);
                    border-radius: 10px;
                    height: 20px;
                    overflow: hidden;
                    margin: 5px 0;
                    position: relative;
                }

                .completeness-fill {
                    height: 100%;
                    border-radius: 10px;
                    transition: width 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-weight: bold;
                    font-size: 0.8rem;
                }

                .completeness-excellent {
                    background: linear-gradient(90deg, #2ecc71, #27ae60);
                }

                .completeness-good {
                    background: linear-gradient(90deg, #f39c12, #e67e22);
                }

                .completeness-poor {
                    background: linear-gradient(90deg, #e74c3c, #c0392b);
                }

                /* === CSS ADICIONAL PARA ANÁLISIS DETALLADOS === */

                /* Contenedor de análisis */
                .analysis-content {
                    background: rgba(255, 255, 255, 0.02);
                    border-radius: 15px;
                    padding: 20px;
                    margin: 20px 0;
                }

                .analysis-content h3 {
                    color: #a8e6cf;
                    margin-bottom: 20px;
                    font-size: 1.5rem;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }

                /* Grid de estadísticas */
                .stats-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                    gap: 15px;
                    margin: 20px 0;
                }

                .stat-card {
                    background: rgba(255, 255, 255, 0.05);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    border-radius: 10px;
                    padding: 15px;
                    text-align: center;
                    transition: all 0.3s ease;
                }

                .stat-card:hover {
                    background: rgba(255, 255, 255, 0.08);
                    border-color: rgba(168, 230, 207, 0.3);
                    transform: translateY(-2px);
                }

                .stat-card h4 {
                    color: #a8e6cf;
                    margin-bottom: 10px;
                    font-size: 0.9rem;
                    font-weight: normal;
                }

                .stat-value {
                    font-size: 1.8rem;
                    font-weight: bold;
                    color: white;
                    margin-bottom: 5px;
                    line-height: 1;
                }

                /* Contenedor de gráficos */
                .charts-container {
                    margin: 30px 0;
                }

                .chart-container {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 12px;
                    padding: 20px;
                    margin: 20px 0;
                    border: 1px solid rgba(255, 255, 255, 0.1);
                }

                .chart-container h4 {
                    color: #a8e6cf;
                    margin-bottom: 15px;
                    text-align: center;
                    font-size: 1.1rem;
                }

                .chart-placeholder {
                    min-height: 300px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #ccc;
                    font-style: italic;
                }

                /* Sección de información */
                .info-section {
                    background: rgba(168, 230, 207, 0.1);
                    border-radius: 10px;
                    padding: 15px;
                    margin: 20px 0;
                    border-left: 4px solid #a8e6cf;
                }

                .info-section h4 {
                    color: #a8e6cf;
                    margin-bottom: 10px;
                }

                .info-section p {
                    margin: 5px 0;
                    color: white;
                }

                /* Grid de información */
                .info-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 15px;
                    margin: 20px 0;
                }

                .info-item {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 8px;
                    padding: 15px;
                }

                .info-item h4 {
                    color: #a8e6cf;
                    margin-bottom: 8px;
                    font-size: 0.9rem;
                }

                .info-item p {
                    color: white;
                    margin: 0;
                    word-break: break-word;
                }

                /* Completitud de datos */
                .completeness-info {
                    background: rgba(255, 255, 255, 0.03);
                    border-radius: 10px;
                    padding: 20px;
                    margin: 20px 0;
                }

                .completeness-info h4 {
                    color: #a8e6cf;
                    margin-bottom: 15px;
                }

                .completeness-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                    gap: 10px;
                }

                .completeness-item {
                    padding: 10px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 0.9rem;
                }

                .completeness-item.complete {
                    background: rgba(72, 187, 120, 0.2);
                    color: #48bb78;
                    border: 1px solid rgba(72, 187, 120, 0.3);
                }

                .completeness-item.incomplete {
                    background: rgba(245, 101, 101, 0.2);
                    color: #f56565;
                    border: 1px solid rgba(245, 101, 101, 0.3);
                }

                /* Lista de feeds */
                .feeds-list {
                    margin: 30px 0;
                }

                .feeds-list h4 {
                    color: #a8e6cf;
                    margin-bottom: 15px;
                }

                .feeds-container {
                    display: grid;
                    gap: 15px;
                }

                .feed-item {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 8px;
                    padding: 15px;
                    border-left: 3px solid #a8e6cf;
                    transition: background 0.3s ease;
                }

                .feed-item:hover {
                    background: rgba(255, 255, 255, 0.08);
                }

                .feed-item h5 {
                    color: white;
                    margin-bottom: 10px;
                    font-size: 1rem;
                }

                .feed-item p {
                    margin: 5px 0;
                    color: #ccc;
                    font-size: 0.9rem;
                }

                .feed-item a {
                    color: #a8e6cf;
                    text-decoration: none;
                    font-size: 0.9rem;
                }

                .feed-item a:hover {
                    text-decoration: underline;
                }

                /* Lista de canciones */
                .tracks-list {
                    margin: 30px 0;
                }

                .tracks-list h4 {
                    color: #a8e6cf;
                    margin-bottom: 15px;
                }

                .tracks-container {
                    background: rgba(255, 255, 255, 0.03);
                    border-radius: 10px;
                    overflow: hidden;
                }

                .track-item {
                    display: grid;
                    grid-template-columns: 50px 1fr auto;
                    gap: 15px;
                    padding: 12px 20px;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                    align-items: center;
                    transition: background 0.3s ease;
                }

                .track-item:hover {
                    background: rgba(255, 255, 255, 0.05);
                }

                .track-item:last-child {
                    border-bottom: none;
                }

                .track-number {
                    color: #a8e6cf;
                    font-weight: bold;
                    text-align: center;
                    font-size: 0.9rem;
                }

                .track-title {
                    color: white;
                    font-weight: 500;
                }

                .track-duration {
                    color: #ccc;
                    font-family: monospace;
                    font-size: 0.9rem;
                }

                /* Grid de créditos */
                .credits-grid {
                    display: grid;
                    gap: 20px;
                    margin: 20px 0;
                }

                .credit-item {
                    background: rgba(255, 255, 255, 0.05);
                    border-radius: 10px;
                    padding: 20px;
                    border-left: 4px solid #a8e6cf;
                }

                .credit-item h4 {
                    color: #a8e6cf;
                    margin-bottom: 10px;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }

                .credit-item p {
                    color: white;
                    line-height: 1.5;
                    margin: 0;
                    word-break: break-word;
                }

                /* Información de escuchas */
                .listening-info {
                    background: rgba(168, 230, 207, 0.1);
                    border-radius: 10px;
                    padding: 20px;
                    margin: 20px 0;
                    text-align: center;
                }

                .listening-info p {
                    color: white;
                    margin: 0;
                    font-size: 1.1rem;
                }

                .no-listening-info {
                    background: rgba(255, 255, 255, 0.03);
                    border-radius: 10px;
                    padding: 20px;
                    margin: 20px 0;
                    text-align: center;
                }

                .no-listening-info p {
                    color: #ccc;
                    margin: 0;
                    font-style: italic;
                }

                /* Mensajes de error en análisis */
                .error-message {
                    background: rgba(245, 101, 101, 0.1);
                    border: 1px solid rgba(245, 101, 101, 0.3);
                    border-radius: 10px;
                    padding: 20px;
                    text-align: center;
                    color: #f56565;
                    margin: 20px 0;
                }

                .error-message i {
                    font-size: 2rem;
                    margin-bottom: 10px;
                    display: block;
                }

                /* Pestañas de análisis */
                .analysis-tabs {
                    display: flex;
                    gap: 10px;
                    margin: 20px 0;
                    overflow-x: auto;
                    padding: 10px 0;
                }

                .analysis-tab {
                    background: rgba(255, 255, 255, 0.1);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    color: white;
                    padding: 12px 16px;
                    border-radius: 20px;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    white-space: nowrap;
                    font-size: 0.9rem;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }

                .analysis-tab:hover {
                    background: rgba(168, 230, 207, 0.2);
                    border-color: #a8e6cf;
                    transform: translateY(-2px);
                }

                .analysis-tab.active {
                    background: rgba(168, 230, 207, 0.3);
                    border-color: #a8e6cf;
                    color: #a8e6cf;
                    font-weight: bold;
                }

                .analysis-tab i {
                    font-size: 1rem;
                }

                /* Responsive design para análisis */
                @media (max-width: 768px) {
                    .stats-grid {
                        grid-template-columns: 1fr;
                    }

                    .info-grid {
                        grid-template-columns: 1fr;
                    }

                    .completeness-grid {
                        grid-template-columns: 1fr;
                    }

                    .track-item {
                        grid-template-columns: 40px 1fr;
                        gap: 10px;
                    }

                    .track-duration {
                        grid-column: 2;
                        text-align: right;
                        font-size: 0.8rem;
                        margin-top: 5px;
                    }

                    .stat-value {
                        font-size: 1.5rem;
                    }

                    .analysis-content {
                        padding: 15px;
                    }

                    .chart-container {
                        padding: 15px;
                    }

                    .analysis-tabs {
                        flex-direction: column;
                        gap: 8px;
                    }

                    .analysis-tab {
                        justify-content: center;
                        border-radius: 10px;
                    }
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- <div class="header">
            <h1><i class="fas fa-music"></i> Music Web Explorer</h1>
            <p>Explora tu biblioteca musical</p>
        </div> -->

            <div class="search-container">
                <div class="search-box-wrapper">
                    <i class="fas fa-music search-icon"></i>
                    <input
                        type="text"
                        id="searchBox"
                        class="search-box"
                        placeholder="Buscar artistas, álbumes o canciones..."
                    />
                </div>
            </div>

            <div class="tabs-container">
                <button class="tab active" data-tab="search">
                    <i class="fas fa-search"></i> Búsqueda
                </button>
                <button class="tab" data-tab="recent">
                    <i class="fas fa-history"></i> Recientes
                </button>
                <button class="tab" data-tab="popular">
                    <i class="fas fa-fire"></i> Populares
                </button>
                <button class="tab" data-tab="concerts">
                    <i class="fas fa-calendar"></i> Conciertos
                </button>
                <button class="tab" data-tab="new">
                    <i class="fas fa-plus"></i> Nuevos
                </button>
                <button class="tab" data-tab="config">
                    <i class="fas fa-cog"></i> Configuración
                </button>
                <button class="tab" data-tab="statistics">
                    <i class="fas fa-chart-bar"></i> Estadísticas
                </button>
            </div>

            <div class="content-area">
                <div id="content">
                    <div class="no-results">
                        <i
                            class="fas fa-search"
                            style="
                                font-size: 3rem;
                                margin-bottom: 20px;
                                display: block;
                            "
                        ></i>
                        <p>
                            Usa el buscador para encontrar artistas, álbumes y
                            canciones
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // === CLASE PRINCIPAL ===
            class MusicWebExplorer {
                constructor() {
                    this.currentTab = "search";
                    this.history = [];
                    this.currentPage = "home";
                    this.searchResults = {};
                    this.activeDownloads = {};

                    this.initEventListeners();
                    this.loadInitialContent();
                }

                initEventListeners() {
                    // REEMPLAZAR el método con:

                    // Búsqueda automática al escribir (sin botón)
                    let searchTimeout;
                    document
                        .getElementById("searchBox")
                        .addEventListener("input", (e) => {
                            clearTimeout(searchTimeout);
                            const query = e.target.value.trim();

                            if (query.length >= 2) {
                                searchTimeout = setTimeout(() => {
                                    this.performSearch();
                                }, 500); // Esperar 500ms después de que deje de escribir
                            } else if (query.length === 0) {
                                this.showSearchContent(); // Mostrar pantalla inicial si está vacío
                            }
                        });

                    // Búsqueda inmediata con Enter
                    document
                        .getElementById("searchBox")
                        .addEventListener("keypress", (e) => {
                            if (e.key === "Enter") {
                                clearTimeout(searchTimeout);
                                this.performSearch();
                            }
                        });

                    // Tabs
                    document.querySelectorAll(".tab").forEach((tab) => {
                        tab.addEventListener("click", (e) =>
                            this.switchTab(e.target.dataset.tab),
                        );
                    });

                    // Navegación con teclas
                    document.addEventListener("keydown", (e) => {
                        if (e.key === "Escape") window.goBack();
                        if (e.ctrlKey && e.key === "f") {
                            e.preventDefault();
                            document.getElementById("searchBox").focus();
                        }
                    });
                }
                loadInitialContent() {
                    this.showContent("search");
                }

                // === BÚSQUEDA PRINCIPAL ===

                async performSearch() {
                    const query = document
                        .getElementById("searchBox")
                        .value.trim();
                    if (query.length < 2) {
                        window.showError(
                            "La búsqueda debe tener al menos 2 caracteres",
                        );
                        return;
                    }

                    this.showLoading("Buscando...");

                    try {
                        const response = await fetch(
                            `/api/search/global?q=${encodeURIComponent(query)}`,
                        );
                        const data = await response.json();

                        if (data.error) {
                            window.showError(data.error);
                            return;
                        }

                        this.searchResults = data.results;
                        this.showSearchResults(query);
                    } catch (error) {
                        console.error("Error en búsqueda:", error);
                        window.showError("Error al realizar la búsqueda");
                    }
                }

                showSearchResults(query) {
                    const { artists, albums, tracks } = this.searchResults;
                    const totalResults =
                        artists.length + albums.length + tracks.length;

                    if (totalResults === 0) {
                        this.showContent(
                            "search",
                            `
                        <div class="no-results">
                            <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px; display: block;"></i>
                            <p>No se encontraron resultados para "${query}"</p>
                        </div>
                    `,
                        );
                        return;
                    }

                    let content = `
                    <h2>Resultados para "${query}" (${totalResults})</h2>
                    <div class="search-results-tabs">
                        <button class="search-tab active" onclick="app.showSearchTab('artists')">
                            Artistas (${artists.length})
                        </button>
                        <button class="search-tab" onclick="app.showSearchTab('albums')">
                            Álbumes (${albums.length})
                        </button>
                        <button class="search-tab" onclick="app.showSearchTab('tracks')">
                            Canciones (${tracks.length})
                        </button>
                    </div>
                    <div id="searchTabContent">
                        ${this.renderArtistsGrid(artists)}
                    </div>
                `;

                    this.showContent("search", content);
                }

                showSearchTab(tabType) {
                    document
                        .querySelectorAll(".search-tab")
                        .forEach((tab) => tab.classList.remove("active"));
                    event.target.classList.add("active");

                    const content = document.getElementById("searchTabContent");

                    switch (tabType) {
                        case "artists":
                            content.innerHTML = this.renderArtistsGrid(
                                this.searchResults.artists,
                            );
                            break;
                        case "albums":
                            content.innerHTML = this.renderAlbumsGrid(
                                this.searchResults.albums,
                            );
                            break;
                        case "tracks":
                            content.innerHTML = this.renderTracksGrid(
                                this.searchResults.tracks,
                            );
                            break;
                    }
                }

                // === RENDERIZADO DE RESULTADOS ===

                renderArtistsGrid(artists) {
                    if (!artists.length) {
                        return '<div class="no-results">No se encontraron artistas</div>';
                    }

                    return `
                    <div class="results-grid">
                        ${artists
                            .map(
                                (artist) => `
                            <div class="card" onclick="app.showArtist(${artist.id})">
                                <div class="card-image">
                                    <img src="/api/images/artist/${artist.id}"
                                         alt="${artist.name}"
                                         onerror="this.src='/static/images/artist_default.jpg'">
                                </div>
                                <div class="card-title">${artist.name}</div>
                                <div class="card-info">
                                    ${artist.total_albums ? `${artist.total_albums} álbumes` : ""}
                                    ${artist.origin ? `<br>Origen: ${artist.origin}` : ""}
                                </div>
                            </div>
                        `,
                            )
                            .join("")}
                    </div>
                `;
                }

                renderAlbumsGrid(albums) {
                    if (!albums.length) {
                        return '<div class="no-results">No se encontraron álbumes</div>';
                    }

                    return `
                    <div class="results-grid">
                        ${albums
                            .map(
                                (album) => `
                            <div class="card" onclick="app.showAlbum(${album.id})">
                                <div class="card-image">
                                    <img src="/api/images/album/${album.id}"
                                         alt="${album.name}"
                                         onerror="this.src='/static/images/album_default.jpg'">
                                </div>
                                <div class="card-title">${album.name}</div>
                                <div class="card-subtitle">${album.artist_name || "Artista desconocido"}</div>
                                <div class="card-info">
                                    ${album.year ? `Año: ${album.year}` : ""}
                                    ${album.total_tracks ? `<br>${album.total_tracks} canciones` : ""}
                                </div>
                            </div>
                        `,
                            )
                            .join("")}
                    </div>
                `;
                }

                renderTracksGrid(tracks) {
                    if (!tracks.length) {
                        return '<div class="no-results">No se encontraron canciones</div>';
                    }

                    return `
                    <div class="track-list">
                        ${tracks
                            .map((track) => {
                                // Usar los campos exactos de tu BD
                                const trackId = track.id;
                                const trackNumber =
                                    track.track_number ||
                                    track.track_num ||
                                    "?";
                                const artist =
                                    track.artist || "Artista desconocido";
                                const album =
                                    track.album ||
                                    track.album_name ||
                                    "Álbum desconocido";
                                const title =
                                    track.title || "Título desconocido";

                                return `
                                <div class="track-item" onclick="app.showTrack(${trackId})">
                                    <div class="track-number">${trackNumber}</div>
                                    <div class="track-info">
                                        <div class="track-title">${title}</div>
                                        <div class="track-duration">
                                            ${artist} - ${album}
                                            ${track.duration ? window.formatDuration(track.duration) : ""}
                                        </div>
                                    </div>
                                    <div class="track-actions">
                                        <button class="btn btn-secondary" onclick="event.stopPropagation(); app.showLyrics(${trackId})">
                                            <i class="fas fa-quote-right"></i> Letras
                                        </button>
                                    </div>
                                </div>
                            `;
                            })
                            .join("")}
                    </div>
                `;
                }
                // === NAVEGACIÓN DE CONTENIDO ===

                async showArtist(artistId) {
                    window.pushHistory({ type: "artist", id: artistId });
                    this.showLoading("Cargando artista...");

                    try {
                        const [artistResponse, albumsResponse] =
                            await Promise.all([
                                fetch(`/api/artists/${artistId}`),
                                fetch(`/api/artists/${artistId}/albums`),
                            ]);

                        const artistData = await artistResponse.json();
                        const albumsData = await albumsResponse.json();

                        if (artistData.error || albumsData.error) {
                            window.showError(
                                "Error cargando información del artista",
                            );
                            return;
                        }

                        this.renderArtistPage(
                            artistData.artist,
                            albumsData.albums,
                        );
                    } catch (error) {
                        console.error("Error cargando artista:", error);
                        window.showError(
                            "Error cargando información del artista",
                        );
                    }
                }

                renderArtistPage(artist, albums) {
                    const content = `
                    <button class="back-btn" onclick="app.goBack()">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>

                    <div class="artist-info">
                        <div class="artist-image">
                            <img src="/api/images/artist/${artist.id}"
                                 alt="${artist.name}"
                                 onerror="this.src='/static/images/artist_default.jpg'">
                        </div>
                        <div class="artist-details">
                            <h2>${artist.name}</h2>
                            ${artist.bio ? `<div class="artist-bio">${artist.bio}</div>` : ""}
                            ${artist.origin ? `<p><strong>Origen:</strong> ${artist.origin}</p>` : ""}
                            ${artist.formed_year ? `<p><strong>Formado:</strong> ${artist.formed_year}</p>` : ""}

                            <div class="artist-links">
                                ${artist.spotify_url ? `<a href="${artist.spotify_url}" target="_blank" class="link-btn"><i class="fab fa-spotify"></i> Spotify</a>` : ""}
                                ${artist.youtube_url ? `<a href="${artist.youtube_url}" target="_blank" class="link-btn"><i class="fab fa-youtube"></i> YouTube</a>` : ""}
                                ${artist.wikipedia_url ? `<a href="${artist.wikipedia_url}" target="_blank" class="link-btn"><i class="fab fa-wikipedia-w"></i> Wikipedia</a>` : ""}
                            </div>
                        </div>
                    </div>

                    <h3>Álbumes (${albums.length})</h3>
                    ${this.renderAlbumsGrid(albums)}
                `;

                    this.showContent("artist", content);
                }

                async showAlbum(albumId) {
                    window.pushHistory({ type: "album", id: albumId });
                    this.showLoading("Cargando álbum...");

                    try {
                        const [albumResponse, tracksResponse] =
                            await Promise.all([
                                fetch(`/api/albums/${albumId}`),
                                fetch(`/api/albums/${albumId}/tracks`),
                            ]);

                        const albumData = await albumResponse.json();
                        const tracksData = await tracksResponse.json();

                        if (albumData.error || tracksData.error) {
                            window.showError(
                                "Error cargando información del álbum",
                            );
                            return;
                        }

                        this.renderAlbumPage(
                            albumData.album,
                            tracksData.tracks,
                        );
                    } catch (error) {
                        console.error("Error cargando álbum:", error);
                        window.showError(
                            "Error cargando información del álbum",
                        );
                    }
                }

                renderAlbumPage(album, tracks) {
                    const content = `
                    <button class="back-btn" onclick="app.goBack()">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>

                    <div class="artist-info">
                        <div class="artist-image">
                            <img src="/api/images/album/${album.id}"
                                alt="${album.name}"
                                onerror="this.src='/static/images/album_default.jpg'">
                        </div>
                        <div class="artist-details">
                            <h2>${album.name}</h2>
                            <p class="card-subtitle">${album.artist_name}</p>
                            ${album.year ? `<p><strong>Año:</strong> ${album.year}</p>` : ""}
                            ${album.label ? `<p><strong>Sello:</strong> ${album.label}</p>` : ""}
                            ${album.genre ? `<p><strong>Género:</strong> ${album.genre}</p>` : ""}

                            <button class="btn" onclick="app.downloadAlbum(${album.id})" id="download-btn-${album.id}">
                                <i class="fas fa-download"></i> <span id="download-text-${album.id}">Descargar Álbum</span>
                            </button>
                        </div>
                    </div>

                    <h3>Canciones (${tracks.length})</h3>
                    ${this.renderTracksGrid(tracks)}
                `;

                    this.showContent("album", content);

                    // Detectar modo de descarga y actualizar texto del botón
                    fetch("/api/download/mode")
                        .then((response) => response.json())
                        .then((data) => {
                            const downloadText = document.getElementById(
                                `download-text-${album.id}`,
                            );
                            if (downloadText && data.mode === "ssh") {
                                downloadText.textContent =
                                    "Transferir Álbum (SSH)";
                                downloadText.parentElement.classList.add(
                                    "btn-warning",
                                );
                                downloadText.parentElement.classList.remove(
                                    "btn",
                                );
                            }
                        })
                        .catch((e) =>
                            console.warn(
                                "No se pudo obtener modo de descarga:",
                                e,
                            ),
                        );
                }

                // === DESCARGAS ===

                async downloadAlbum(albumId) {
                    try {
                        // Obtener información del álbum para mostrar en el progreso
                        let albumInfo = null;
                        try {
                            const albumResponse = await fetch(
                                `/api/albums/${albumId}`,
                            );
                            if (albumResponse.ok) {
                                const albumData = await albumResponse.json();
                                albumInfo = albumData.album;
                            }
                        } catch (e) {
                            console.warn(
                                "No se pudo obtener info del álbum para progreso:",
                                e,
                            );
                        }

                        // Obtener modo de descarga
                        let downloadMode = "local";
                        try {
                            const modeResponse =
                                await fetch("/api/download/mode");
                            if (modeResponse.ok) {
                                const modeData = await modeResponse.json();
                                downloadMode = modeData.mode;
                            }
                        } catch (e) {
                            console.warn(
                                "No se pudo obtener modo de descarga:",
                                e,
                            );
                        }

                        this.showLoading("Iniciando descarga...");

                        const response = await fetch(
                            `/api/download/album/${albumId}`,
                            {
                                method: "POST",
                            },
                        );

                        if (!response.ok) {
                            throw new Error(
                                `HTTP ${response.status}: ${response.statusText}`,
                            );
                        }

                        const data = await response.json();

                        if (data.error) {
                            window.showError(data.error);
                            return;
                        }

                        if (!data.download_id) {
                            window.showError(
                                "No se recibió ID de descarga del servidor",
                            );
                            return;
                        }

                        console.log(
                            "Descarga iniciada con ID:",
                            data.download_id,
                        );
                        console.log("Modo de descarga:", downloadMode);

                        // Mostrar progreso según el modo
                        if (downloadMode === "ssh") {
                            this.monitorSSHDownload(
                                data.download_id,
                                albumInfo,
                            );
                        } else {
                            this.monitorDownload(data.download_id, albumInfo);
                        }
                    } catch (error) {
                        console.error("Error iniciando descarga:", error);
                        window.showError(
                            `Error iniciando descarga: ${error.message}`,
                        );
                    }
                }

                getSSHStatusText(status) {
                    const sshStatusTexts = {
                        ssh_preparing: "Preparando transferencia SSH...",
                        ssh_transferring: "Transfiriendo archivos con rsync...",
                        ssh_compressing: "Comprimiendo en servidor remoto...",
                        ssh_cleaning: "Limpiando archivos temporales...",
                        ssh_ready_download: "Listo para descarga",
                        starting: "Iniciando...",
                        error: "Error",
                    };
                    return sshStatusTexts[status] || status;
                }

                async downloadSSHFile(downloadId) {
                    try {
                        window.showToast("Preparando descarga SSH...", "info");

                        // Marcar como completado para descarga
                        const compressResponse = await fetch(
                            `/api/download/compress/${downloadId}`,
                            {
                                method: "POST",
                            },
                        );

                        if (!compressResponse.ok) {
                            const errorData = await compressResponse.json();
                            throw new Error(
                                errorData.error ||
                                    "Error preparando descarga SSH",
                            );
                        }

                        const compressResult = await compressResponse.json();

                        if (!compressResult.success) {
                            throw new Error(
                                compressResult.error ||
                                    "Error en compresión SSH",
                            );
                        }

                        // Iniciar descarga del archivo
                        const link = document.createElement("a");
                        link.href = `/api/download/file/${downloadId}`;
                        link.download = compressResult.zip_filename || "";
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        // Mostrar mensaje sobre borrado automático
                        window.showToast(
                            "Descarga SSH iniciada. El archivo se borrará automáticamente en 3 minutos.",
                            "warning",
                            5000,
                        );

                        // Actualizar estado para mostrar que se descargó
                        const statusElement = document.getElementById(
                            `download-status-${downloadId}`,
                        );
                        if (statusElement) {
                            statusElement.innerHTML = `
                            <div class="alert alert-info">
                                <h6><i class="fas fa-check-circle"></i> Descarga SSH completada</h6>
                                <p><strong>${compressResult.album_name || "Álbum"}</strong> - ${compressResult.artist_name || "Artista"}</p>
                                <p>Archivo descargado: ${compressResult.zip_filename}</p>
                                <p><strong>Tamaño:</strong> ${window.formatBytes(compressResult.file_size || 0)}</p>
                                <div class="mt-2">
                                    <small class="text-warning">⚠️ El archivo se borrará automáticamente del servidor en 3 minutos</small>
                                </div>
                            </div>
                        `;
                        }
                    } catch (error) {
                        console.error("Error descargando archivo SSH:", error);
                        window.showToast(
                            `Error en descarga SSH: ${error.message}`,
                            "error",
                        );
                    }
                }

                updateSSHDownloadStatus(downloadId, status) {
                    const statusElement = document.getElementById(
                        `download-status-${downloadId}`,
                    );
                    const progressBarElement = document.getElementById(
                        `progress-bar-${downloadId}`,
                    );

                    if (!statusElement) return;

                    // Actualizar barra de progreso si existe
                    if (progressBarElement && status.progress !== undefined) {
                        const progressPercent = Math.round(
                            status.progress || 0,
                        );
                        progressBarElement.style.width = `${progressPercent}%`;
                        progressBarElement.textContent = `${progressPercent}%`;
                    }

                    if (status.status === "ssh_ready_download") {
                        // NUEVO ESTADO: Transferencia SSH completa, listo para comprimir y descargar
                        if (progressBarElement) {
                            progressBarElement.classList.remove(
                                "progress-bar-animated",
                                "progress-bar-striped",
                            );
                            progressBarElement.style.width = "100%";
                            progressBarElement.textContent = "100%";
                        }

                        statusElement.innerHTML = `
                        <div class="alert alert-success">
                            <h6><i class="fas fa-server"></i> Transferencia SSH completada</h6>
                            <p><strong>${status.album_name || "Álbum"}</strong> - ${status.artist_name || "Artista"}</p>
                            <p>Archivos transferidos al servidor remoto</p>
                            <p><strong>Archivo comprimido:</strong> ${window.formatBytes(status.file_size || 0)}</p>

                            <div class="mt-3 d-flex gap-2 flex-wrap">
                                <button class="btn btn-success" onclick="app.downloadSSHFile('${downloadId}')">
                                    <i class="fas fa-download"></i> Descargar Álbum Comprimido
                                </button>
                                <button class="btn btn-outline-info btn-sm" onclick="app.checkDownloadStatus('${downloadId}')">
                                    <i class="fas fa-info-circle"></i> Ver Detalles
                                </button>
                            </div>

                            <div class="mt-2">
                                <small class="text-success">✅ Los archivos se copiaron exitosamente al servidor remoto</small>
                            </div>
                        </div>
                    `;
                    } else if (status.status === "completed") {
                        // Estado final para descargas SSH ya comprimidas
                        this.updateDownloadStatus(downloadId, status); // Usar método original
                    } else if (status.status === "error") {
                        statusElement.innerHTML = `
                        <div class="alert alert-danger">
                            <h6><i class="fas fa-exclamation-triangle"></i> Error en transferencia SSH</h6>
                            <p>${status.error || "Error desconocido"}</p>
                            <button class="btn btn-outline-secondary btn-sm" onclick="app.clearDownloadStatus('${downloadId}')">
                                Cerrar
                            </button>
                        </div>
                    `;
                    } else {
                        // En progreso SSH - INTERFAZ MEJORADA
                        const progressPercent = Math.round(
                            status.progress || 0,
                        );
                        const currentTrack =
                            status.current_track || "Procesando...";
                        const statusText = this.getSSHStatusText(status.status);

                        // Actualizar solo el contenido del estado si existe el contenedor
                        const statusContentElement = document.getElementById(
                            `downloadStatus-${downloadId}`,
                        );
                        if (statusContentElement) {
                            statusContentElement.innerHTML = `
                            <div class="progress-status">
                                <div class="current-track">${currentTrack}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span>${statusText}</span>
                                    <span>${progressPercent}%</span>
                                </div>
                                ${status.remote_path ? `<small class="text-muted">Ruta remota: ${status.remote_path}</small>` : ""}
                            </div>
                        `;
                        }
                    }
                }

                async monitorSSHDownload(downloadId, albumInfo = null) {
                    const progressContainer = document.createElement("div");
                    progressContainer.className = "download-progress";
                    progressContainer.id = `download-status-${downloadId}`;

                    // Título dinámico con información del álbum si está disponible
                    const albumTitle = albumInfo
                        ? `Transfiriendo "${albumInfo.name}" de ${albumInfo.artist_name} (SSH)`
                        : "Transfiriendo álbum vía SSH...";

                    progressContainer.innerHTML = `
                    <h4 id="download-title-${downloadId}">${albumTitle}</h4>
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                            id="progress-bar-${downloadId}" style="width: 0%">0%</div>
                    </div>
                    <div id="downloadStatus-${downloadId}">Preparando transferencia SSH...</div>
                `;

                    document
                        .getElementById("content")
                        .appendChild(progressContainer);

                    let attempts = 0;
                    const maxAttempts = 200; // 6-7 minutos máximo para SSH

                    const checkProgress = async () => {
                        try {
                            const statusUrl = `/api/download/status/${downloadId}`;
                            console.log(
                                `🔍 Consultando estado SSH en: ${statusUrl}`,
                            );

                            const response = await fetch(statusUrl);

                            console.log(
                                `📡 Respuesta del servidor SSH: ${response.status} ${response.statusText}`,
                            );

                            if (!response.ok) {
                                const errorText = await response.text();
                                console.error(
                                    `❌ Error HTTP ${response.status}:`,
                                    errorText,
                                );
                                throw new Error(
                                    `HTTP ${response.status}: ${response.statusText}`,
                                );
                            }

                            const status = await response.json();
                            console.log(
                                "✅ Estado de descarga SSH recibido:",
                                status,
                            );

                            // Actualizar título si tenemos nueva información del álbum
                            if (status.album_name && status.artist_name) {
                                const titleElement = document.getElementById(
                                    `download-title-${downloadId}`,
                                );
                                if (titleElement) {
                                    titleElement.textContent = `Transfiriendo "${status.album_name}" de ${status.artist_name} (SSH)`;
                                }
                            }

                            this.updateSSHDownloadStatus(downloadId, status);

                            // Parar monitoreo si está completado, con error, o si excedemos intentos
                            if (
                                status.status === "ssh_ready_download" ||
                                status.status === "completed" ||
                                status.status === "error" ||
                                attempts >= maxAttempts
                            ) {
                                if (
                                    attempts >= maxAttempts &&
                                    ![
                                        "ssh_ready_download",
                                        "completed",
                                        "error",
                                    ].includes(status.status)
                                ) {
                                    console.warn(
                                        "⏰ Timeout monitoreando descarga SSH",
                                    );
                                    window.showToast(
                                        "Timeout monitoreando descarga SSH. Verifica manualmente el estado.",
                                        "warning",
                                    );
                                } else {
                                    console.log(
                                        `🏁 Monitoreo SSH terminado. Estado final: ${status.status}`,
                                    );
                                }
                                return;
                            }

                            attempts++;
                            setTimeout(checkProgress, 2000);
                        } catch (error) {
                            console.error(
                                "💥 Error monitoreando descarga SSH:",
                                error,
                            );
                            attempts++;

                            if (attempts < maxAttempts) {
                                console.log(`🔄 Reintentando en 5 segundos...`);
                                setTimeout(checkProgress, 5000);
                            } else {
                                console.error(
                                    "🚫 Máximo de intentos SSH alcanzado",
                                );
                                const statusElement = document.getElementById(
                                    `download-status-${downloadId}`,
                                );
                                if (statusElement) {
                                    statusElement.innerHTML = `
                                    <div class="alert alert-danger">
                                        <h6><i class="fas fa-exclamation-triangle"></i> Error de conexión SSH</h6>
                                        <p>No se pudo monitorear la descarga SSH después de ${maxAttempts} intentos.</p>
                                        <p><strong>Download ID:</strong> ${downloadId}</p>
                                        <button class="btn btn-outline-secondary btn-sm" onclick="app.checkDownloadStatus('${downloadId}')">
                                            🔍 Verificar Estado Manualmente
                                        </button>
                                    </div>
                                `;
                                }
                            }
                        }
                    };

                    // Iniciar monitoreo inmediatamente
                    console.log(
                        `🚀 Iniciando monitoreo SSH para download ID: ${downloadId}`,
                    );
                    checkProgress();
                }

                async monitorDownload(downloadId, albumInfo = null) {
